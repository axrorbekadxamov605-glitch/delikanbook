<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f4f6; /* Och rangli fon */
            color: #111;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi qismlar */
        .background-grid {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 300%;
            display: flex;
            gap: 12px;
            padding: 10px;
            pointer-events: none;
            z-index: 1;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Sekin va silliq harakatlanish animatsiyasi */
        .col-down {
            animation: scrollDown 14s linear infinite;
        }

        .col-up {
            animation: scrollUp 14s linear infinite;
        }

        @keyframes scrollDown {
            0% { transform: translateY(0); }
            100% { transform: translateY(33.33%); }
        }

        @keyframes scrollUp {
            0% { transform: translateY(33.33%); }
            100% { transform: translateY(0); }
        }

        .col img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        /* Chap tomondagi KITOBLAR yozuvlari ustuni */
        .text-col {
            justify-content: space-around;
            align-items: flex-start;
            padding-left: 10px;
        }

        .bg-text {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            color: #d1d1d6;
            white-space: nowrap;
            letter-spacing: 1px;
        }

        .bg-text.highlight {
            color: #b31930; /* Qizil yorqin yozuv */
        }

        /* Ustki qoplama va pastdagi Boshlash tugmasi */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(244,244,246,0.2) 0%, rgba(244,244,246,0.75) 75%, rgba(244,244,246,0.98) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .bottom-box {
            text-align: center;
            padding-bottom: 25px;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #b31930;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(179, 25, 48, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Harakatlanuvchi fon qismi -->
    <div class="background-grid">
        <!-- 1-ustun: KITOBLAR yozuvlari -->
        <div class="col col-down text-col">
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
        </div>

        <!-- 2-ustun: Siz tashlagan logo.jpg rasmi (pastdan yuqoriga) -->
        <div class="col col-up">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
        </div>

        <!-- 3-ustun: Siz tashlagan logo.jpg rasmi (yuqoridan pastga) -->
        <div class="col col-down">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
        </div>
    </div>

    <!-- Tugmalar qismi -->
    <div class="overlay">
        <div class="top-bar">
            <button class="close-btn" onclick="Telegram.WebApp.close()">✕ Yopish</button>
        </div>
        <div class="bottom-box">
            <button class="start-btn" onclick="alert('Deli KansBook katalogiga xush kelibsiz!')">
                Boshlash ➔
            </button>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
