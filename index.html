<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
        }

        .logo-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            margin: 0 auto 15px auto;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #a0a0a0;
            letter-spacing: 0.5px;
        }

        .content-box {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .welcome-text {
            font-size: 15px;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #121212;
            font-weight: bold;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">
            <img src="logo.jpg" alt="Deli KansBook Logo">
        </div>
        <h1>Deli KansBook</h1>
        <p class="subtitle">Kanselyariya va kitob mahsulotlari</p>
    </div>

    <div class="content-box">
        <p class="welcome-text">
            Xush kelibsiz! Do'konimiz katalogi va xizmatlaridan foydalanish uchun botimizga o'ting.
        </p>
        <button class="btn" onclick="Telegram.WebApp.close()">Yopish va Botga qaytish</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
