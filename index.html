<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #111;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1-QISM: Kirish oynasi */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f6;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .background-grid {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 300%;
            display: flex;
            gap: 12px;
            padding: 10px;
            pointer-events: none;
            z-index: 1;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .col-down { animation: scrollDown 14s linear infinite; }
        .col-up { animation: scrollUp 14s linear infinite; }

        @keyframes scrollDown {
            0% { transform: translateY(0); }
            100% { transform: translateY(33.33%); }
        }

        @keyframes scrollUp {
            0% { transform: translateY(33.33%); }
            100% { transform: translateY(0); }
        }

        .col img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .text-col {
            justify-content: space-around;
            align-items: flex-start;
            padding-left: 10px;
        }

        .bg-text {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            color: #d1d1d6;
            white-space: nowrap;
        }

        .bg-text.highlight { color: #b31930; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(244,244,246,0.2) 0%, rgba(244,244,246,0.75) 75%, rgba(244,244,246,0.98) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar { display: flex; justify-content: flex-start; }

        .close-btn {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .bottom-box { text-align: center; padding-bottom: 25px; z-index: 20; }

        .start-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #b31930;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(179, 25, 48, 0.4);
        }

        /* 2-QISM: Asosiy do'kon sahifasi */
        #main-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            background-color: #fff;
            overflow-y: auto;
            padding-bottom: 70px;
        }

        .main-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h2 { font-size: 14px; color: #666; font-weight: normal; }
        .user-info h1 { font-size: 20px; color: #111; font-weight: bold; }

        .user-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #b31930;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .search-box { padding: 0 20px; margin-bottom: 20px; }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            background: #f1f1f3;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
        }

        .section-title { padding: 0 20px; font-size: 18px; font-weight: bold; margin-bottom: 12px; }

        .categories {
            display: flex;
            gap: 12px;
            padding: 0 20px;
            overflow-x: auto;
            margin-bottom: 25px;
        }

        .cat-card {
            min-width: 140px;
            height: 90px;
            background: #f1f1f3;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .cat-card h3 { font-size: 15px; color: #111; }
        .cat-card span { font-size: 12px; color: #666; }

        /* Pastki navigatsiya menyusi */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 11px;
            gap: 4px;
        }

        .nav-item.active { color: #b31930; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- 1. Kirish oynasi -->
    <div id="welcome-screen">
        <div class="background-grid">
            <div class="col col-down text-col">
                <div class="bg-text">KITOBLAR</div>
                <div class="bg-text">KITOBLAR</div>
                <div class="bg-text highlight">KITOBLAR</div>
            </div>
            <div class="col col-up">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
            </div>
            <div class="col col-down">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
            </div>
        </div>

        <div class="overlay">
            <div class="top-bar">
                <button class="close-btn" onclick="window.close()">✕ Yopish</button>
            </div>
            <div class="bottom-box">
                <button class="start-btn" id="startBtn">
                    Boshlash ➔
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Asosiy do'kon oynasi -->
    <div id="main-screen">
        <div>
            <div class="main-header">
                <div class="user-info">
                    <h2>Xush kelibsiz,</h2>
                    <h1>Ahrorbek Adxamov</h1>
                </div>
                <div class="user-avatar">
                    <img src="logo.jpg" alt="Profil">
                </div>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Kitob yoki muallif qidirish...">
            </div>

            <div class="section-title">Kategoriyalar</div>
            <div class="categories">
                <div class="cat-card" style="background: #eef2ff;">
                    <h3>Shaxsiy rivojlanish</h3>
                    <span>50 ta kitob</span>
                </div>
                <div class="cat-card" style="background: #fdf4ff;">
                    <h3>Diniy</h3>
                    <span>54 ta kitob</span>
                </div>
                <div class="cat-card" style="background: #fff7ed;">
                    <h3>Badiiy</h3>
                    <span>32 ta kitob</span>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Qaydlarim
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Sevimlilar
            </a>
            <a href="#" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20c-1.1 0-1.99.9-1.99 2S8.9 24 10 24s2-.9 2-2-.9-2-2-2zm0-18c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 12c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                Katalog
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                Savatcha
            </a>
            <a href="#" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profil
            </a>
        </div>
    </div>

    <script>
        // Tugma bosilganda ishlaydigan oddiy va kafolatlangan funksiya
        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        });
    </script>
</body>
</html>
