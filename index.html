<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi qismlar */
        .background-grid {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 300%;
            display: flex;
            gap: 15px;
            opacity: 0.9;
            pointer-events: none;
            z-index: 1;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Yuqoridan pastga tez harakatlanadigan animatsiya (4 sekund) */
        .col-down {
            animation: scrollDown 4s linear infinite;
        }

        /* Pastdan yuqoriga tez harakatlanadigan animatsiya (4 sekund) */
        .col-up {
            animation: scrollUp 4s linear infinite;
        }

        @keyframes scrollDown {
            0% { transform: translateY(0); }
            100% { transform: translateY(33.33%); }
        }

        @keyframes scrollUp {
            0% { transform: translateY(33.33%); }
            100% { transform: translateY(0); }
        }

        .col img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .text-box {
            display: flex;
            flex-direction: column;
            gap: 35px;
            justify-content: center;
            align-items: center;
        }

        .bg-text {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            letter-spacing: 2px;
        }

        .bg-text.highlight {
            color: #ff2a4d;
            text-shadow: 0 0 20px rgba(255, 42, 77, 0.9);
        }

        /* Ustki qoplama va tugma */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(11,11,11,0.3) 0%, rgba(11,11,11,0.65) 80%, rgba(11,11,11,0.95) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.25);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .bottom-box {
            text-align: center;
            padding-bottom: 25px;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #b31930;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(179, 25, 48, 0.6);
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Harakatlanuvchi fon qismi -->
    <div class="background-grid">
        <div class="col col-down">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
        </div>

        <div class="col col-up text-box">
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
            <div class="bg-text">KITOBLAR</div>
            <div class="bg-text highlight">KITOBLAR</div>
        </div>

        <div class="col col-down">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
            <img src="logo.jpg" alt="Logo">
        </div>
    </div>

    <!-- Tugmalar qismi -->
    <div class="overlay">
        <div class="top-bar">
            <button class="close-btn" onclick="Telegram.WebApp.close()">✕ Yopish</button>
        </div>
        <div class="bottom-box">
            <button class="start-btn" onclick="alert('Deli KansBook katalogiga xush kelibsiz!')">
                Boshlash ➔
            </button>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
