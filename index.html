<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Orqa fondagi siljiydigan rasm va matnlar effekti */
        .background-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
        }

        .col img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
        }

        .text-col {
            justify-content: space-around;
            align-items: center;
        }

        .bg-text {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            color: #444;
            white-space: nowrap;
        }

        .bg-text.highlight {
            color: #b31930;
            text-shadow: 0 0 15px rgba(179, 25, 48, 0.6);
        }

        /* Asosiy oyna va tugma qismi */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(13,13,13,0.3) 0%, rgba(13,13,13,0.9) 80%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: flex-start;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .bottom-box {
            text-align: center;
            padding-bottom: 30px;
        }

        .start-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #b31930;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(179, 25, 48, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi kitoblar va matnlar -->
    <div class="background-grid">
        <div class="col text-col">
            <span class="bg-text">KITOBLAR</span>
            <span class="bg-text">KITOBLAR</span>
            <span class="bg-text highlight">KITOBLAR</span>
            <span class="bg-text">KITOBLAR</span>
            <span class="bg-text">KITOBLAR</span>
        </div>
        <div class="col">
            <img src="logo.jpg" alt="Kitob">
            <img src="logo.jpg" alt="Kitob">
            <img src="logo.jpg" alt="Kitob">
            <img src="logo.jpg" alt="Kitob">
        </div>
    </div>

    <!-- Ustki qism va tugma -->
    <div class="overlay">
        <div class="top-bar">
            <button class="close-btn" onclick="Telegram.WebApp.close()">✕ Yopish</button>
        </div>
        <div class="bottom-box">
            <button class="start-btn" onclick="alert('Deli KansBook katalogiga xush kelibsiz!')">
                Boshlash ➔
            </button>
        </div>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
