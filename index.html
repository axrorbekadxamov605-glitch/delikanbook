<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deli KansBook</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #111;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1-QISM: Kirish oynasi (Harakatlanuvchi fon) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f4f4f6;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .background-grid {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 300%;
            display: flex;
            gap: 12px;
            padding: 10px;
            pointer-events: none;
            z-index: 1;
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .col-down { animation: scrollDown 14s linear infinite; }
        .col-up { animation: scrollUp 14s linear infinite; }

        @keyframes scrollDown {
            0% { transform: translateY(0); }
            100% { transform: translateY(33.33%); }
        }

        @keyframes scrollUp {
            0% { transform: translateY(33.33%); }
            100% { transform: translateY(0); }
        }

        .col img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .text-col {
            justify-content: space-around;
            align-items: flex-start;
            padding-left: 10px;
        }

        .bg-text {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            color: #d1d1d6;
            white-space: nowrap;
        }

        .bg-text.highlight { color: #b31930; }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(244,244,246,0.2) 0%, rgba(244,244,246,0.75) 75%, rgba(244,244,246,0.98) 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .top-bar { display: flex; justify-content: flex-start; }

        .close-btn {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .bottom-box { text-align: center; padding-bottom: 25px; z-index: 20; }

        .start-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
            background: #b31930;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(179, 25, 48, 0.4);
        }

        /* 2-QISM: Asosiy do'kon sahifasi (Mutolaa uslubida) */
        #main-screen {
            display: none;
            height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            background-color: #fcfcfc;
            overflow-y: auto;
            padding-bottom: 70px;
        }

        .main-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .user-info h2 { font-size: 12px; color: #888; font-weight: normal; }
        .user-info h1 { font-size: 17px; color: #111; font-weight: bold; }

        .admin-badge-btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .content-body { padding: 15px 20px; }

        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; color: #111; display: flex; justify-content: space-between; align-items: center; }

        /* Kategoriyalar lentasi */
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            scrollbar-width: none;
            padding-bottom: 5px;
        }

        .cat-chip {
            background: #f1f1f3;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .cat-chip.active {
            background: #b31930;
            color: white;
            font-weight: 500;
        }

        /* Kitob do'koni tokchalari (Grid) */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .book-card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 14px;
            overflow: hidden;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.1s;
        }

        .book-card:active { transform: scale(0.97); }

        .book-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #eee;
        }

        .book-card h4 { font-size: 13px; color: #111; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-card p { font-size: 11px; color: #666; margin-bottom: 6px; }
        .book-card .price { font-size: 14px; color: #b31930; font-weight: bold; display: block; }

        /* 3-QISM: Kitob haqida batafsil va Iqtibos oynasi (Modal) */
        #book-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-height: 85vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h3 { font-size: 18px; }
        .close-modal { background: none; border: none; font-size: 20px; cursor: pointer; color: #666; }

        .modal-book-info { display: flex; gap: 15px; margin-bottom: 15px; }
        .modal-book-info img { width: 90px; height: 130px; object-fit: cover; border-radius: 8px; }
        .modal-book-details h4 { font-size: 16px; margin-bottom: 5px; }
        .modal-book-details p { font-size: 13px; color: #666; margin-bottom: 8px; }
        .modal-book-details .modal-price { font-size: 16px; color: #b31930; font-weight: bold; }

        .quote-box-section {
            background: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .quote-box-section label { font-size: 12px; font-weight: bold; color: #444; display: block; margin-bottom: 5px; }
        .quote-box-section textarea {
            width: 100%;
            height: 60px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            outline: none;
            resize: none;
            background: #fff;
        }

        .buy-full-btn {
            background: #b31930;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        /* 4-QISM: Admin Paneli (Faqat admin uchun) */
        #admin-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 300;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .admin-form-group { margin-bottom: 15px; }
        .admin-form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .admin-form-group input, .admin-form-group select, .admin-form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #f9f9f9;
        }

        .save-book-btn {
            background: #111;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Pastki navigatsiya menyusi */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eaeaea;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 50;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #888;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active { color: #b31930; }
        .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <!-- 1. Kirish oynasi -->
    <div id="welcome-screen">
        <div class="background-grid">
            <div class="col col-down text-col">
                <div class="bg-text">KITOBLAR</div>
                <div class="bg-text">KITOBLAR</div>
                <div class="bg-text highlight">KITOBLAR</div>
            </div>
            <div class="col col-up">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
            </div>
            <div class="col col-down">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
                <img src="logo.jpg" alt="Logo">
            </div>
        </div>

        <div class="overlay">
            <div class="top-bar">
                <button class="close-btn" onclick="Telegram.WebApp.close()">✕ Yopish</button>
            </div>
            <div class="bottom-box">
                <button class="start-btn" id="startBtn">
                    Boshlash ➔
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Asosiy do'kon sahifasi -->
    <div id="main-screen">
        <div>
            <div class="main-header">
                <div class="user-info">
                    <h2>Xush kelibsiz,</h2>
                    <h1 id="user-telegram-name">Foydalanuvchi</h1>
                </div>
                <!-- Faqat admin ko'radigan panel tugmasi -->
                <button id="adminBtn" class="admin-badge-btn" style="display:none;" onclick="openAdminPanel()">⚙️ Admin</button>
            </div>

            <div class="content-body">
                <!-- Kategoriyalar filtri -->
                <div class="categories-scroll" id="categoryChips">
                    <div class="cat-chip active" onclick="filterCategory('Barchasi', this)">Barchasi</div>
                    <div class="cat-chip" onclick="filterCategory('Shaxsiy rivojlanish', this)">Shaxsiy rivojlanish</div>
                    <div class="cat-chip" onclick="filterCategory('Diniy', this)">Diniy</div>
                    <div class="cat-chip" onclick="filterCategory('Badiiy', this)">Badiiy</div>
                </div>

                <div class="section-title">
                    <span>Kitoblar katalogi</span>
                </div>

                <!-- Kitoblar chiqadigan tokcha -->
                <div class="books-grid" id="booksGridContainer">
                    <!-- Dinamik ravishda kitoblar qo'shiladi -->
                </div>
            </div>
        </div>

        <!-- Pastki menyu bar -->
        <div class="bottom-nav">
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                Qaydlarim
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Sevimlilar
            </div>
            <div class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20c-1.1 0-1.99.9-1.99 2S8.9 24 10 24s2-.9 2-2-.9-2-2-2zm0-18c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 12c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
                Katalog
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                Savatcha
            </div>
            <div class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profil
            </div>
        </div>
    </div>

    <!-- 3. Kitob batafsil va iqtibos yozish oynasi -->
    <div id="book-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="m-book-title">Kitob nomi</h3>
                <button class="close-modal" onclick="closeBookModal()">✕</button>
            </div>
            <div class="modal-book-info">
                <img id="m-book-img" src="" alt="Kitob">
                <div class="modal-book-details">
                    <h4 id="m-book-author">Muallif</h4>
                    <p id="m-book-cat">Kategoriya</p>
                    <span class="modal-price" id="m-book-price">0 so'm</span>
                </div>
            </div>

            <!-- Mutolaa uslubidagi iqtibos yozish -->
            <div class="quote-box-section">
                <label>✍️ Ushbu kitob haqida o'z iqtibosingiz yoki taassurotingizni yozing:</label>
                <textarea id="userQuoteInput" placeholder="Masalan: Insonni tubdan o'zgartiradigan ajoyib kitob..."></textarea>
            </div>

            <button class="buy-full-btn" onclick="orderBook()">Sotib olish</button>
        </div>
    </div>

    <!-- 4. Admin Paneli (Kitob qo'shish) -->
    <div id="admin-panel">
        <div class="admin-header">
            <h3>⚙️ Admin: Yangi kitob qo'shish</h3>
            <button class="close-modal" onclick="closeAdminPanel()">✕ Yopish</button>
        </div>
        <div class="admin-form-group">
            <label>Kitob nomi</label>
            <input type="text" id="newTitle" placeholder="Masalan: Atom odatlar">
        </div>
        <div class="admin-form-group">
            <label>Muallifi</label>
            <input type="text" id="newAuthor" placeholder="Masalan: Jeyms Klir">
        </div>
        <div class="admin-form-group">
            <label>Kategoriyasi</label>
            <select id="newCategory">
                <option value="Shaxsiy rivojlanish">Shaxsiy rivojlanish</option>
                <option value="Diniy">Diniy</option>
                <option value="Badiiy">Badiiy</option>
            </select>
        </div>
        <div class="admin-form-group">
            <label>Narxi (so'm)</label>
            <input type="text" id="newPrice" placeholder="Masalan: 45,000">
        </div>
        <div class="admin-form-group">
            <label>Rasm havolasi (URL yoki logo.jpg)</label>
            <input type="text" id="newImage" value="logo.jpg" placeholder="logo.jpg">
        </div>
        <button class="save-book-btn" onclick="addNewBook()">Kitobni katalogga qo'shish</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Admin Telegram ID (O'zingizning Telegram raqamli ID'ingizni shu yerga yozasiz, masalan: 123456789)
        const ADMIN_TELEGRAM_ID = 000000000; // <--- O'z ID raqamingizni yozing

        // Boshlang'ich kitoblar bazasi
        let books = [
            { id: 1, title: "Atom odatlar", author: "Jeyms Klir", category: "Shaxsiy rivojlanish", price: "50,000", image: "logo.jpg", quote: "" },
            { id: 2, title: "Ibodat-i qalbiya", author: "Shayx Muhammad Sodiq", category: "Diniy", price: "45,000", image: "logo.jpg", quote: "" },
            { id: 3, title: "1984", author: "Jorj Oruell", category: "Badiiy", price: "40,000", image: "logo.jpg", quote: "" }
        ];

        let currentSelectedBookId = null;

        // Foydalanuvchi Telegram niki aniqlash
        window.addEventListener('DOMContentLoaded', () => {
            const tgUser = Telegram.WebApp.initDataUnsafe?.user;
            const nameEl = document.getElementById('user-telegram-name');
            const adminBtn = document.getElementById('adminBtn');

            if (tgUser && tgUser.first_name) {
                nameEl.innerText = tgUser.username ? `@${tgUser.username}` : tgUser.first_name;
                
                // Agar kirgan odam admin bo'lsa, admin tugmasini chiqarish
                if (tgUser.id === ADMIN_TELEGRAM_ID) {
                    adminBtn.style.display = 'inline-block';
                }
            } else {
                nameEl.innerText = "Mehmon (Telegram)";
            }

            renderBooks('Barchasi');
        });

        // Boshlash tugmasi
        document.getElementById('startBtn').addEventListener('click', function() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        });

        // Kitoblarni ekranga chiqarish
        function renderBooks(category) {
            const grid = document.getElementById('booksGridContainer');
            grid.innerHTML = '';

            let filtered = books;
            if (category !== 'Barchasi') {
                filtered = books.filter(b => b.category === category);
            }

            filtered.forEach(book => {
                grid.innerHTML += `
                    <div class="book-card" onclick="openBookModal(${book.id})">
                        <img src="${book.image}" alt="Book">
                        <h4>${book.title}</h4>
                        <p>${book.author}</p>
                        <span class="price">${book.price} so'm</span>
                    </div>
                `;
            });
        }

        // Kategoriyalar bo'yicha filtrlash
        function filterCategory(cat, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            renderBooks(cat);
        }

        // Kitob ustiga bosganda modalni ochish
        function openBookModal(id) {
            currentSelectedBookId = id;
            const book = books.find(b => b.id === id);
            if (!book) return;

            document.getElementById('m-book-title').innerText = book.title;
            document.getElementById('m-book-author').innerText = book.author;
            document.getElementById('m-book-cat').innerText = book.category;
            document.getElementById('m-book-price').innerText = book.price + " so'm";
            document.getElementById('m-book-img').src = book.image;
            document.getElementById('userQuoteInput').value = book.quote || '';

            document.getElementById('book-modal').style.display = 'flex';
        }

        function closeBookModal() {
            document.getElementById('book-modal').style.display = 'none';
        }

        // Kitob sotib olish va iqtibosni saqlash
        function orderBook() {
            const quoteText = document.getElementById('userQuoteInput').value;
            const book = books.find(b => b.id === currentSelectedBookId);
            if(book) {
                book.quote = quoteText;
            }
            alert("Kitob savatga qo'shildi va iqtibosingiz saqlandi!");
            closeBookModal();
        }

        // Admin panelini ochish/yopish
        function openAdminPanel() {
            document.getElementById('admin-panel').style.display = 'flex';
        }
        function closeAdminPanel() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        // Yangi kitob qo'shish (Admin uchun juda oson)
        function addNewBook() {
            const title = document.getElementById('newTitle').value;
            const author = document.getElementById('newAuthor').value;
            const category = document.getElementById('newCategory').value;
            const price = document.getElementById('newPrice').value;
            const image = document.getElementById('newImage').value;

            if (!title || !price) {
                alert("Iltimos, kitob nomi va narxini kiriting!");
                return;
            }

            const newBook = {
                id: books.length + 1,
                title: title,
                author: author || 'Noma\'lum',
                category: category,
                price: price,
                image: image || 'logo.jpg',
                quote: ''
            };

            books.push(newBook);
            renderBooks('Barchasi');
            closeAdminPanel();
            alert("Yangi kitob katalogga muvaffaqiyatli qo'shildi!");

            // Formani tozalash
            document.getElementById('newTitle').value = '';
            document.getElementById('newAuthor').value = '';
            document.getElementById('newPrice').value = '';
        }
    </script>
</body>
</html>
